################################################################################
# KNOWN LIMITATIONS / THINGS TO WATCH
################################################################################

known_issues:
  - id: triplets_currently_zero
    description: >
      The triplet count shown in the retrain summary is 0 right now.
      FP-Growth with min_support=0.01 on the current dataset produces no
      3-item frequent itemsets above threshold.  To get triplets, either
      lower MIN_SUPPORT (e.g. to 0.005) in train_menu() or grow the dataset.
      The DB schema and write logic already support combo_size=3 fully.

  - id: combo_suggestions_empty_before_train
    description: >
      The /api/combos/suggestions endpoint returns an empty array if train.py
      has never been run on the current DB (no auto_mined rows exist).
      ComboSuggestions.jsx renders nothing in that case (returns null) which
      is correct — no error is thrown.

  - id: new_item_badge_requires_ml_service
    description: >
      The fallback path in revenueController.js always returns is_new_item=false
      because it doesn't have the new_items_set logic.  The 🆕 badge only
      appears when the ML service is running and returns data from the trained
      model, which includes is_new_item=true on qualifying items.

  - id: handleAddCombo_skips_inventory_blocked_items
    description: >
      If a combo contains an item that is out of stock (can_make=false in
      menuOptions), that item is silently skipped — the combo is still
      "added" but with fewer items than expected.  Consider adding a toast
      warning to the user in this case.
